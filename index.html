<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First Tech Project</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 2.5rem;
            border-radius: 15px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.2);
            max-width: 400px;
        }
        h1 {
            margin-top: 0;
            font-size: 2.2rem;
            color: #4facfe;
        }
        p {
            font-size: 1.1rem;
            line-height: 1.6;
            color: #e0e0e0;
        }
        button {
            background: #4facfe;
            color: white;
            border: none;
            padding: 0.8rem 1.8rem;
            font-size: 1rem;
            border-radius: 25px;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
            font-weight: bold;
            margin-top: 1rem;
        }
        button:hover {
            background: #00f2fe;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Hello, World! 🚀</h1>
        <p>Welcome to my brand new tech project. This page is hosted securely on GitHub.</p>
        <button onclick="celebrate()">Click Me!</button>
    </div>

    <script>
        function celebrate() {
            alert("🎉 Awesome! You successfully created and ran your first web app project!");
        }
    </script>

</body>
</html>
